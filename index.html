<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&C - Dicționarul Școlar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- ========== HEADER START ========== -->
        <div class="header">
            <div class="logo">
                <h1>📚 B&C - Dicționarul Școlar</h1>
                <p>Sinonime · Antonime · Definiții · Explicații</p>
                <p style="font-size: 0.75rem; margin-top: 0.2rem; opacity: 0.8;">proiect realizat de Salcoci Cătălin & Popușoi Bogdan</p>
            </div>
            <div class="dark-toggle" id="darkModeToggle">
                <span>🌙</span> 
                <span id="modeText">Mod întunecat</span>
            </div>
        </div>
        <!-- ========== HEADER END ========== -->

        <div id="resultContainer">
            <div class="info-text">
                ✨ Bun venit la B&C - Dicționarul Școlar!<br>
                🚀 Pull Request #1: Header adăugat cu succes.
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
<!-- ========== SEARCH BAR START ========== -->
<div class="search-section">
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="Exemplu: frumos, prietenie, munte, călătorie, bucurie..." autocomplete="off">
        <button id="searchBtn">
            🔍 <span>Caută cuvânt</span>
        </button>
    </div>
    <div id="suggestions" class="suggestions-dropdown"></div>
</div>
<!-- ========== SEARCH BAR END ========== -->
 <div class="pronunciation-container" id="pronunciationContainer" style="display: none;">
    <button id="playAudioBtn" class="audio-btn">🔊 Ascultă pronunția</button>
</div>
