<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&C - Dicționarul Școlar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
     <link rel="icon" type="image/x-icon" href="https://media.gettyimages.com/id/2183725086/vector/open-book-line-icon-vector-design.jpg?s=612x612&w=0&k=20&c=VH2WQe2t1YZigeVczY7vN4APlNCemLNFI27ugGGyBnU=">
</head>
<body>
    <div class="container">
        <!-- ========== HEADER START ========== -->
        <div class="header">
            <div class="logo">
                <h1>📚 B&C - Dicționarul Școlar</h1>
                <p>Sinonime · Antonime · Definiții · Explicații</p>
                <p style="font-size: 0.75rem; margin-top: 0.2rem; opacity: 0.8;">proiect realizat de Salcoci Cătălin & Popușoi Bogdan</p>
            </div>
            <div class="dark-toggle" id="darkModeToggle">
                <span>🌙</span> 
                <span id="modeText">Mod întunecat</span>
            </div>
        </div>
        <!-- ========== HEADER END ========== -->

        <div id="resultContainer">
            <div class="info-text">
                ✨ Bun venit la B&C - Dicționarul Școlar!<br>
               
            </div>
        </div>

        <!-- ========== SEARCH BAR START ========== -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="wordInput" placeholder="Exemplu: frumos, prietenie, munte, călătorie, bucurie..." autocomplete="off">
                <button id="searchBtn">
                    🔍 <span>Caută cuvânt</span>
                </button>
                <button id="randomBtn" class="random-btn" type="button">🎲 Random</button>
            </div>
        </div>
        <!-- ========== SEARCH BAR END ========== -->

         <!-- Secțiune Istoric Căutări Recente -->
        <div class="history-section">
            <div class="history-header">
                <div class="history-title">
                    <span>🕒</span>
                    <span>Căutări recente</span>
                </div>
                <button class="clear-history" id="clearHistoryBtn">Șterge istoric</button>
            </div>
            <div id="historyContainer" class="history-buttons">
                <!-- Aici se vor afișa automat cuvintele căutate recent -->
            </div>
        </div>

        <!-- Secțiune Cuvântul zilei -->
        <div class="word-of-day-section">
            <div class="word-of-day-header">
                <div class="word-of-day-title">
                    <span>⭐</span>
                    <span>Cuvântul zilei</span>
                </div>
                <span class="current-date" id="currentDate"></span>
            </div>
            <div class="word-of-day-content" id="wordOfDayContent">
                <!-- Se încarcă automat cu cuvântul zilei -->
                <div class="loading">Se încarcă...</div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
